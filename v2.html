<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CATSPACE / Observatory — V2</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050811;color:#e9edf8;font-family:Inter,"PingFang SC",sans-serif}button{font:inherit;cursor:pointer}body{overflow:hidden}#sky{position:fixed;inset:0;width:100%;height:100%}.world{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 55% 42%,#27305060 0,transparent 40%),linear-gradient(180deg,#070b19 0%,#111c30 55%,#05080f 100%)}.planet{position:absolute;width:42vw;height:42vw;min-width:400px;min-height:400px;border-radius:50%;top:-24vw;right:-13vw;background:radial-gradient(circle at 35% 65%,#7d8ca8,#354568 30%,#111b32 57%,#070c19 70%);box-shadow:0 0 110px #8496db33,inset -45px -30px 90px #000b;filter:blur(.3px);opacity:.7}.nebula{position:absolute;inset:0;background:radial-gradient(ellipse at 49% 35%,#6d70b725,transparent 35%),radial-gradient(ellipse at 16% 58%,#34628d24,transparent 40%);pointer-events:none}.architecture{position:absolute;inset:0;perspective:1100px;pointer-events:none}.vault{position:absolute;left:50%;top:47%;width:130vw;height:78vw;max-height:1100px;transform:translate(-50%,-50%) rotateX(67deg);border:2px solid #a9b6df36;border-radius:50%;box-shadow:0 0 0 22px #141e3055,0 0 0 26px #8297c541,0 0 0 86px #0c14257a,0 0 0 89px #8196c126,0 0 70px #a3bbff30,inset 0 0 70px #a4c0fa29}.vault:before{content:"";position:absolute;inset:12%;border:1px solid #a1add35e;border-radius:50%;box-shadow:0 0 0 20px #0b122744,0 0 0 22px #a5b6e02a}.vault:after{content:"";position:absolute;inset:30%;border:1px solid #a7b4e056;border-radius:50%}.arch{position:absolute;top:-16%;height:125%;width:2px;background:linear-gradient(#0000,#7e9bd05c 22%,#cad4f189 50%,#192a4b55 83%,#0000);left:var(--x);transform:rotate(var(--r));transform-origin:50% 50%;box-shadow:0 0 14px #7c9ad340}.floor{position:absolute;left:-20%;bottom:-45%;width:140%;height:72%;transform:perspective(700px) rotateX(67deg);background:repeating-linear-gradient(90deg,transparent 0 8%,#879cc31b 8.1%,transparent 8.2%),repeating-linear-gradient(0deg,#0b1223 0 11%,#a6b5dc19 11.1%,#0b1223 11.3%);box-shadow:0 -35px 120px #8799dd26;opacity:.9}.floor:after{content:"";position:absolute;left:22%;top:10%;width:56%;height:60%;background:radial-gradient(ellipse,#a0a7f63c,transparent 65%);filter:blur(28px)}.rail{position:absolute;left:-8%;right:-8%;bottom:20%;height:1px;background:linear-gradient(90deg,transparent,#b6c4ed88,transparent);box-shadow:0 0 20px #a2b6ed80}.rail:after{content:"";position:absolute;inset:22px 0 0;border-top:1px solid #7f94bf35}.core-wrap{position:absolute;left:50%;top:46%;width:min(35vw,430px);height:min(35vw,430px);min-width:260px;min-height:260px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 60px #a29ff859);animation:float 7s ease-in-out infinite}.aura{position:absolute;inset:-27%;border-radius:50%;background:radial-gradient(circle,#aaa5fb25 0,#7895fb16 27%,transparent 64%);filter:blur(10px)}.orbit{position:absolute;inset:5%;border:1px solid #c2c6f2a1;border-radius:50%;transform:rotateX(68deg) rotate(-22deg);box-shadow:0 0 14px #a6aafc99;animation:spin 19s linear infinite}.orbit.b{inset:-12%;border-color:#98b8f178;transform:rotateX(75deg) rotate(68deg);animation-duration:27s;animation-direction:reverse}.orbit.c{inset:-1%;border-color:#d9b5f278;transform:rotateY(65deg) rotate(18deg);animation-duration:32s}.nucleus{position:absolute;inset:22%;border-radius:42% 58% 60% 40%/44% 37% 63% 56%;background:radial-gradient(circle at 28% 18%,#fff9 0,transparent 20%),conic-gradient(from 20deg,#7c95d8,#e2b7ee,#8fe1d6,#a7a4ff,#354a83,#edb4dc,#7c95d8);box-shadow:inset -18px -25px 40px #131d4f9c,inset 10px 8px 26px #ffffff9c,0 0 35px #a6adf27a;animation:morph 9s ease-in-out infinite,spin 31s linear infinite}.nucleus:after{content:"";position:absolute;inset:7%;border-radius:38% 62% 47% 53%;border:1px solid #fff9;box-shadow:inset 5px 12px 25px #e5ecf4a8,0 0 15px #f0d9f4;transform:rotate(38deg)}.core-wrap:hover .nucleus{filter:brightness(1.3)}@keyframes float{50%{transform:translate(-50%,-54%)}}@keyframes morph{50%{border-radius:61% 39% 35% 65%/56% 62% 38% 44%;transform:scale(1.08) rotate(15deg)}}@keyframes spin{to{rotate:360deg}}.cat{position:absolute;left:22%;bottom:14%;font-size:36px;filter:drop-shadow(0 0 8px #8d9ce8aa);opacity:.85}.panel{position:absolute;top:40%;width:170px;min-height:110px;background:linear-gradient(125deg,#b3c8e018,#9ca8e009);border:1px solid #b8c8ee3b;box-shadow:0 20px 70px #0008,inset 0 0 25px #b6c9fa0c;backdrop-filter:blur(12px);padding:18px;transform:perspective(650px) rotateY(var(--turn));transition:transform .3s,border-color .3s;pointer-events:auto;text-align:left;color:#e9efff}.panel:hover{border-color:#c5c8f6;transform:perspective(650px) rotateY(var(--turn)) translateY(-10px)}.panel small{display:block;color:#a7b7d7;letter-spacing:.19em;font-size:9px;margin-bottom:16px}.panel strong{font-size:16px;font-weight:450}.panel.one{left:12%;--turn:24deg}.panel.two{right:11%;--turn:-24deg}.panel.three{left:18%;top:64%;--turn:19deg}.panel.four{right:17%;top:65%;--turn:-19deg}.top{position:absolute;z-index:5;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:28px 5%;background:linear-gradient(#060913bd,transparent)}.brand{font-size:14px;font-weight:650;letter-spacing:.16em}.brand span{display:block;font-size:9px;color:#9eaac5;font-weight:400;letter-spacing:.21em;margin-top:7px}.nav{display:flex;gap:26px;align-items:center;font-size:10px;letter-spacing:.17em;color:#aebad5}.switch{border:1px solid #a8b7d04a;background:#a9b6e011;color:#e5eafb;border-radius:25px;padding:11px 18px}.intro{position:absolute;left:6%;top:25%;z-index:3;pointer-events:none}.intro .eyebrow{color:#aebcda;letter-spacing:.25em;font-size:10px}.intro h1{font-family:Georgia,serif;font-size:clamp(36px,5vw,75px);font-weight:400;line-height:1.13;letter-spacing:-.055em;margin:25px 0}.intro h1 i{color:#c9c5f4;font-weight:400}.intro p{font-size:12px;line-height:2;color:#aeb9d0}.bottom{position:absolute;bottom:28px;left:5%;right:5%;z-index:4;display:flex;justify-content:space-between;color:#aab7d2;font-size:9px;letter-spacing:.19em}.detail{position:fixed;z-index:20;right:0;top:0;bottom:0;width:min(450px,100%);padding:95px 45px;background:#0a1021ed;border-left:1px solid #b2c1ec4a;backdrop-filter:blur(30px);transform:translateX(102%);transition:transform .5s}.detail.open{transform:translateX(0)}.detail button{position:absolute;top:30px;right:35px;background:none;color:white;border:0;font-size:26px}.detail small{font-size:10px;letter-spacing:.2em;color:#aab6d4}.detail h2{font-family:Georgia,serif;font-size:43px;font-weight:400;margin-top:60px}.detail p{line-height:2;color:#abb8d0;font-size:14px}.browse{position:fixed;z-index:9;inset:0;background:#090e1b;overflow:auto;padding:115px 7% 80px;display:none}.browse.active{display:block}.browse h2{font-family:Georgia,serif;font-weight:400;font-size:clamp(45px,7vw,100px);letter-spacing:-.06em}.browse p{color:#aab7d2;line-height:2}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:65px}.tile{padding:40px;background:linear-gradient(130deg,#242a4a,#10172b);border:1px solid #aab7d22b;text-align:left;color:white;min-height:190px}.tile small{display:block;letter-spacing:.17em;color:#aab7d2;margin-bottom:60px}.tile strong{font-size:26px;font-weight:400}@media(max-width:760px){.nav{gap:8px}.nav .navlink{display:none}.top{padding:20px 5%}.intro{top:18%;left:7%}.intro h1{font-size:39px}.core-wrap{top:49%}.panel{width:135px;min-height:90px;padding:12px}.panel small{font-size:8px;margin-bottom:9px}.panel strong{font-size:12px}.panel.one{top:66%;left:6%}.panel.two{top:66%;right:6%}.panel.three{top:81%;left:6%}.panel.four{top:81%;right:6%}.cat{bottom:7%;left:50%;font-size:22px}.bottom{bottom:12px;font-size:7px}.grid{grid-template-columns:1fr}.planet{top:-180px;right:-250px}.vault{width:220vw;height:150vw}.intro p{font-size:11px}}
</style></head><body><div class="world" id="world"><canvas id="sky"></canvas><div class="planet"></div><div class="nebula"></div><div class="architecture"><div class="vault"></div><div class="arch" style="--x:12%;--r:18deg"></div><div class="arch" style="--x:88%;--r:-18deg"></div><div class="floor"></div><div class="rail"></div></div><div class="core-wrap" id="core"><div class="aura"></div><div class="orbit"></div><div class="orbit b"></div><div class="orbit c"></div><div class="nucleus"></div></div><div class="cat">♠</div><div class="intro"><div class="eyebrow">✦ PERSONAL OBSERVATORY / 001</div><h1>A space for<br><i>unfinished wonders.</i></h1><p>这里是脏兮兮的猫的私人宇宙。<br>收藏创造、实验、想象，以及尚未命名的可能。</p></div><button class="panel one" data-id="0"><small>01 / PROJECTS</small><strong>作品档案 ↗</strong></button><button class="panel two" data-id="1"><small>02 / LABORATORY</small><strong>AI 实验室 ↗</strong></button><button class="panel three" data-id="2"><small>03 / THOUGHTS</small><strong>思考碎片 ↗</strong></button><button class="panel four" data-id="3"><small>04 / UNKNOWN</small><strong>未知区域 ↗</strong></button></div><header class="top"><div class="brand">CATSPACE<span>THE LIVING UNIVERSE</span></div><div class="nav"><span class="navlink">EST. 2026</span><button class="switch" id="mode">BROWSE MODE ↗</button></div></header><div class="bottom"><span>✧ AN EXPERIMENT IN DIGITAL PRESENCE</span><span>MOVE · DISCOVER · WONDER</span></div><aside class="detail" id="detail"><button id="close">×</button><small id="tag"></small><h2 id="title"></h2><p id="desc"></p></aside><main class="browse" id="browse"><small style="letter-spacing:.2em;color:#aeb8d1">CATSPACE / INDEX</small><h2>Welcome to<br>my little universe.</h2><p>一个学生的作品、实验、思考与奇思妙想。<br>你可以从这里浏览，也可以进入观测站探索。</p><div class="grid" id="grid"></div></main><script>
const items=[['作品档案','SELECTED PROJECTS','收集认真打磨的小产品、交互作品，以及它们从灵感到诞生的过程。'],['AI 实验室','THE LABORATORY','关于 AI Agent、模型协作、创造性工具与新型交互的持续实验。'],['思考碎片','NOTES & IDEAS','设计、技术、生活与想象的片段；这里不需要所有事情都有答案。'],['未知区域','THE UNKNOWN','给偶然、好奇心和隐藏彩蛋留一块地方。']];
const d=document.getElementById('detail');function openItem(i){document.getElementById('tag').textContent='0'+(i+1)+' / '+items[i][1];document.getElementById('title').textContent=items[i][0];document.getElementById('desc').textContent=items[i][2];d.classList.add('open')}document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openItem(+b.dataset.id));document.getElementById('close').onclick=()=>d.classList.remove('open');document.getElementById('grid').innerHTML=items.map((p,i)=>'<button class="tile" data-index="'+i+'"><small>0'+(i+1)+' / '+p[1]+'</small><strong>'+p[0]+' ↗</strong></button>').join('');document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>openItem(+b.dataset.index));let browse=false;document.getElementById('mode').onclick=()=>{browse=!browse;document.getElementById('browse').classList.toggle('active',browse);document.getElementById('mode').textContent=browse?'EXPLORE MODE ↗':'BROWSE MODE ↗';d.classList.remove('open')};
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');let stars=[];function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);stars=Array.from({length:Math.min(420,Math.floor(innerWidth*innerHeight/1800))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.2+.2,a:Math.random()*.55+.15}))}addEventListener('resize',resize);resize();function draw(t){ctx.clearRect(0,0,innerWidth,innerHeight);for(const s of stars){ctx.fillStyle='rgba(198,210,255,'+(s.a*(.8+.2*Math.sin(t*.0007+s.x)))+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}requestAnimationFrame(draw);const core=document.getElementById('core');addEventListener('pointermove',e=>{if(innerWidth>760){const x=(e.clientX/innerWidth-.5)*12,y=(e.clientY/innerHeight-.5)*8;core.style.marginLeft=x+'px';core.style.marginTop=y+'px'}});core.addEventListener('click',()=>{core.style.filter='drop-shadow(0 0 100px #d6bfff)';setTimeout(()=>core.style.filter='',700)});
</script></body></html>
